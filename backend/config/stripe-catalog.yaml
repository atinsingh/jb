version: 1

# Product IDs come exclusively from the named environment variables.
# The active default Price is fetched from Stripe at request time.
audiences:
  candidate:
    - key: paid
      name: Paid
      products:
        monthly:
          env: STRIPE_CANDIDATE_PAID_MONTHLY_PRODUCT_ID
        yearly:
          env: STRIPE_CANDIDATE_PAID_YEARLY_PRODUCT_ID

  employer:
    - key: paid
      name: Paid
      products:
        monthly:
          env: STRIPE_EMPLOYER_PAID_MONTHLY_PRODUCT_ID
        yearly:
          env: STRIPE_EMPLOYER_PAID_YEARLY_PRODUCT_ID

