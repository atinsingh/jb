version: 1
currency: USD
lowRemainingRatio: 0.2
# Public allowances are integer credits. One credit is $0.01 of measured
# LiteLLM spend; only the virtual-key boundary converts these to USD.

tiers:
  FREE:
    maxBudgetCredits: 50
    budgetDuration: 1mo
  PRO:
    maxBudgetCredits: 400
    budgetDuration: 1mo

services:
  - id: resume_agent_turn
    enabled: true
    metered: true
    ownerType: candidate
    pool: candidate-ai
  - id: resume_look_change
    enabled: true
    metered: true
    ownerType: candidate
    pool: candidate-ai
  - id: candidate_ats_review
    enabled: true
    metered: true
    ownerType: candidate
    pool: candidate-ai
  - id: employer_ats_review
    enabled: true
    metered: true
    ownerType: employer
    pool: employer-ai
  - id: ai_content_heuristic
    enabled: true
    metered: false

# Display guidance only. LiteLLM's measured token and reasoning-token spend is
# authoritative; ranges are deliberately not exact charge promises.
