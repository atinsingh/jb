<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root{--bg:#fbf4ea;--ink:#221c15;--body:#4d453b;--muted:#8a8073;--line:#e7ddcb;--go:#1f7a4d;--coral:#ef6a45}
  *{box-sizing:border-box;margin:0}
  body{width:300px;font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--body);padding:16px}
  .top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .gate{width:26px;height:26px;border-radius:8px;background:var(--coral);color:#fff;font:700 12px/1 ui-monospace,monospace;display:grid;place-items:center}
  .brand{font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.02em}
  .state{font-size:13px;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--go)}
  .msg{font-size:13px;line-height:1.5;color:var(--body);margin-bottom:12px}
  button{width:100%;font:800 14px system-ui;border:none;border-radius:24px;padding:12px;cursor:pointer}
  .primary{background:var(--go);color:#fff}
  .primary:disabled{opacity:.5;cursor:not-allowed}
  .ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:8px;font-weight:700}
  .foot{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.5}
  .link{color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:none;width:auto;padding:6px 0;margin-top:6px}
</style>
</head>
<body>
  <div class="top"><span class="gate">JB</span><span class="brand">Jobocate Autofill</span></div>
  <div class="state"><span class="dot" id="dot"></span><span id="stateText">Checking…</span></div>
  <div class="msg" id="msg"></div>
  <button class="primary" id="action" disabled>Autofill this application</button>
  <button class="link" id="disconnect" style="display:none">Disconnect</button>
  <div class="foot">Jobocate fills the form from your profile and stops. Nothing is submitted until you review and submit it yourself.</div>
  <script src="popup.js"></script>
</body>
</html>
