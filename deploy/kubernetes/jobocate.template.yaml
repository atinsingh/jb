apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: jobocate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobocate-backend
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: jobocate-backend
    app.kubernetes.io/part-of: jobocate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jobocate-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobocate-backend
        app.kubernetes.io/part-of: jobocate
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: registry-__REGISTRY__
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8000"
            - name: INTERNAL_FRONTEND_URL
              value: http://jobocate-frontend:3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jobocate-backend
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: jobocate-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobocate-frontend
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: jobocate-frontend
    app.kubernetes.io/part-of: jobocate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobocate-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobocate-frontend
        app.kubernetes.io/part-of: jobocate
    spec:
      imagePullSecrets:
        - name: registry-__REGISTRY__
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /app/login
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /app/login
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /app/login
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jobocate-frontend
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: jobocate-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobocate
  namespace: __NAMESPACE__
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
spec:
  ingressClassName: nginx
  tls:
    - secretName: jobocate-tls
      hosts:
        - __HOST__
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jobocate-backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: jobocate-backend
                port:
                  number: 8000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: jobocate-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobocate-frontend
                port:
                  number: 3000
