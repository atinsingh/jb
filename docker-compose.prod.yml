# ---------------------------------------------------------------------------
# Jobocate - PRODUCTION compose (self-contained)
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Project name is `jb` so these services sit with the rest of the stack in
# Docker Desktop (same group as docker-compose.yml).
#
# Differences vs the dev docker-compose.yml:
#   * Builds the slim `runtime` stages (compiled `node dist/src/main.js` and
#     `next start`) instead of dev servers.
#   * NODE_ENV=production, no source bind mounts, no hot reload.
#   * The backend image entrypoint (CMD) is used - no `command:` override.
#
# `.env.production` is the source of truth. Run
# `scripts/prepare-production-env.ps1` before Compose so each Docker build gets
# only its own generated env file. NEXT_PUBLIC_* values are browser-public.
# ---------------------------------------------------------------------------

name: jb

services:
  mongodb:
    image: mongo:7.0
    container_name: jobocate-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=jobocate
    volumes:
      - mongodb_data:/data/db
    networks:
      - jobocate-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/jobocate --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: jobocate-backend:prod
    container_name: jobocate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env.production
    environment:
      - NODE_ENV=production
      - PORT=8000
      # Internal URL for Puppeteer to reach the frontend on the docker network
      - INTERNAL_FRONTEND_URL=http://frontend:3000
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jobocate-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: jobocate-frontend:prod
    container_name: jobocate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - jobocate-network

networks:
  jobocate-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  backend-uploads:
    driver: local
