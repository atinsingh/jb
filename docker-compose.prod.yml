# ---------------------------------------------------------------------------
# Jobocate - PRODUCTION compose (self-contained)
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Differences vs the dev docker-compose.yml:
#   * Builds the slim `runtime` stages (compiled `node dist/src/main.js` and
#     `next start`) instead of dev servers.
#   * NODE_ENV=production, no source bind mounts, no hot reload.
#   * The backend image entrypoint (CMD) is used - no `command:` override.
#
# Secrets are read from ./.env.local at the repo root (operator-supplied). NEXT_PUBLIC_API_URL
# is inlined into the frontend bundle at build time, so set it to the PUBLIC
# backend URL your users hit (not the internal docker hostname).
# ---------------------------------------------------------------------------

services:
  mongodb:
    image: mongo:7.0
    container_name: jobocate-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=jobocate
    volumes:
      - mongodb_data:/data/db
    networks:
      - jobocate-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/jobocate --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: jobocate-backend:prod
    container_name: jobocate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Operator supplies production secrets here (SUPABASE_*, MONGODB_URI,
    # STRIPE_*, SMTP_*, AI keys - see .env.example at the repo root).
    env_file:
      # One env file for the whole repo — see .env.example.
      - ./.env.local
    environment:
      - NODE_ENV=production
      - PORT=8000
      # Internal URL for Puppeteer to reach the frontend on the docker network
      - INTERNAL_FRONTEND_URL=http://frontend:3000
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jobocate-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # PUBLIC backend URL baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: jobocate-frontend:prod
    container_name: jobocate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - jobocate-network

networks:
  jobocate-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  backend-uploads:
    driver: local
